<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr. D’s Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1/index.js"></script>
</head>
<body>

<div class="page-bg"></div>

<div class="panel" id="panel">

  <div class="site-title-row">
    <h1 class="site-title">Mr. D’s Links</h1>
    <span class="edit-badge" id="editBadge" hidden>Editing</span>
    <span class="save-indicator" id="saveIndicator" hidden></span>
  </div>

  <div class="backup-banner" id="backupBanner" hidden>
    <span id="backupBannerText"></span>
    <div class="backup-banner-actions">
      <button class="btn-secondary" id="backupBannerDismiss" type="button">Later</button>
      <button class="btn-primary" id="backupBannerRun" type="button">Back up now</button>
    </div>
  </div>

  <header class="topbar">
    <div class="collection-title-wrap">
      <h2 id="collectionTitle">Loading…</h2>
      <div class="dropdown-wrap">
        <button class="icon-btn dropdown-btn" id="switchCollectionBtn" title="Switch collection">
          <svg viewBox="0 0 24 24" width="18" height="18" style="pointer-events:none"><path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="dropdown-menu" id="collectionDropdownMenu" hidden>
          <div class="dropdown-fixed">
            <button class="dropdown-item main-item" id="mainDropdownItem">
              <svg viewBox="0 0 24 24" width="15" height="15" class="house-icon"><path d="M3 11l9-8 9 8M5 10v10h14V10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span>Main</span>
            </button>
            <div class="dropdown-divider"></div>
            <div class="sort-row" id="sortRow">
              <button class="sort-btn" id="sortAlphaBtn" data-sort="alpha">A–Z</button>
              <button class="sort-btn" id="sortCountBtn" data-sort="count">#</button>
              <button class="sort-btn" id="sortDateBtn" data-sort="date">◷ Date</button>
            </div>
            <div class="dropdown-divider"></div>
          </div>
          <div class="dropdown-list" id="dropdownList"></div>
        </div>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn backup-btn" id="backupBtn" title="Back up to GitHub" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" style="pointer-events:none"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn add-btn" id="addCollectionBtn" title="Add collection" hidden>
        <svg id="addCollectionIcon" viewBox="0 0 24 24" width="20" height="20" style="pointer-events:none"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-btn pencil-btn" id="editModeBtn" title="Edit collection">
        <svg id="editModeIcon" viewBox="0 0 24 24" width="18" height="18" style="pointer-events:none"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <main class="board" id="board">
    <section class="grid" id="gridLeft" aria-label="Tile grid left"></section>
    <div class="grid-gap" aria-hidden="true"></div>
    <section class="grid" id="gridRight" aria-label="Tile grid right"></section>
  </main>

  <div class="status-msg" id="statusMsg"></div>

</div>

<!-- Password modal -->
<div class="modal-overlay" id="passwordOverlay" hidden>
  <div class="modal-box">
    <h3>Enter password to edit</h3>
    <input type="password" id="passwordInput" placeholder="Password" autocomplete="off">
    <p class="modal-error" id="passwordError" hidden>Incorrect password.</p>
    <div class="modal-actions">
      <button class="btn-secondary" id="passwordCancelBtn">Cancel</button>
      <button class="btn-primary" id="passwordSubmitBtn">Unlock</button>
    </div>
  </div>
</div>

<!-- Populated-tile action menu -->
<div class="modal-overlay" id="tileMenuOverlay" hidden>
  <div class="modal-box menu-box">
    <h3 id="tileMenuTitle">Tile options</h3>
    <div class="menu-list">
      <button class="menu-item" id="menuOpenBtn">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Open link
      </button>
      <button class="menu-item" id="menuEditBtn">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Edit tile
      </button>
      <button class="menu-item" id="menuMoveBtn">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M5 9l-3 3 3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 9l3 3-3 3M2 12h20M12 2v20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Move tile
      </button>
      <button class="menu-item menu-item-danger" id="menuClearBtn">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Clear tile
      </button>
    </div>
    <button class="btn-secondary full-width" id="tileMenuCancelBtn">Cancel</button>
  </div>
</div>

<!-- Move-tile picker -->
<div class="modal-overlay" id="moveOverlay" hidden>
  <div class="modal-box">
    <h3>Move tile to…</h3>
    <p class="modal-hint">Click an empty slot below to move this tile there.</p>
    <div class="move-grid-preview" id="moveGridPreview"></div>
    <button class="btn-secondary full-width" id="moveCancelBtn">Cancel</button>
  </div>
</div>

<!-- Add collection modal -->
<div class="modal-overlay" id="addCollectionOverlay" hidden>
  <div class="modal-box">
    <h3>New collection</h3>
    <input type="text" id="newCollectionTitleInput" placeholder="Collection title" maxlength="60">
    <p class="modal-error" id="addCollectionError" hidden></p>
    <div class="modal-actions">
      <button class="btn-secondary" id="addCollectionCancelBtn">Cancel</button>
      <button class="btn-primary" id="addCollectionCreateBtn">Create</button>
    </div>
  </div>
</div>

<!-- Delete collection: step 1 -->
<div class="modal-overlay" id="deleteStep1Overlay" hidden>
  <div class="modal-box">
    <h3 class="danger-heading">Do you want to DELETE this collection?</h3>
    <div class="modal-actions">
      <button class="btn-secondary" id="deleteStep1CancelBtn">Cancel</button>
      <button class="btn-danger" id="deleteStep1YesBtn">Yes</button>
    </div>
  </div>
</div>

<!-- Delete collection: step 2 -->
<div class="modal-overlay" id="deleteStep2Overlay" hidden>
  <div class="modal-box">
    <h3 class="danger-heading" id="deleteStep2Text">Are you sure you want to delete collection "X"?</h3>
    <div class="modal-actions">
      <button class="btn-secondary" id="deleteStep2NoBtn">No</button>
      <button class="btn-danger" id="deleteStep2YesBtn" disabled>Yes (2)</button>
    </div>
  </div>
</div>

<!-- Tile edit popup -->
<div class="modal-overlay" id="tileEditOverlay" hidden>
  <div class="modal-box tile-edit-box">
    <h3>Edit tile</h3>

    <label class="field-label">Link type</label>
    <div class="toggle-row">
      <button class="toggle-btn active" id="linkTypeUrlBtn" type="button">Web link</button>
      <button class="toggle-btn" id="linkTypeCollectionBtn" type="button">Another collection</button>
    </div>

    <div id="urlFieldGroup">
      <label class="field-label" for="tileLinkInput">Link (URL)</label>
      <div class="input-with-icon">
        <input type="text" id="tileLinkInput" placeholder="https://example.com">
        <button class="clipboard-btn" id="pasteClipboardBtn" title="Paste from clipboard" type="button">
          <svg viewBox="0 0 24 24" width="17" height="17"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="8" y="2" width="8" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </button>
      </div>
    </div>

    <div id="collectionFieldGroup" hidden>
      <label class="field-label" for="tileCollectionSelect">Link to collection</label>
      <select id="tileCollectionSelect"></select>
    </div>

    <label class="field-label" for="tileTitleInput">Title</label>
    <input type="text" id="tileTitleInput" placeholder="Short description" maxlength="80">

    <label class="field-label">Image</label>
    <div class="image-options">
      <label class="radio-row"><input type="radio" name="imgOpt" value="favicon" id="imgOptFavicon"> Favicon (automatic)</label>
      <label class="radio-row"><input type="radio" name="imgOpt" value="screenshot" id="imgOptScreenshot"> Screenshot of page</label>
      <label class="radio-row"><input type="radio" name="imgOpt" value="emoji" id="imgOptEmoji"> Emoji</label>
      <label class="radio-row"><input type="radio" name="imgOpt" value="upload" id="imgOptUpload"> Upload / paste image</label>
    </div>

    <div id="emojiPickerGroup" hidden>
      <div class="emoji-chosen-row">
        <span class="emoji-preview" id="emojiPreview">🙂</span>
        <button class="btn-secondary" id="openEmojiPickerBtn" type="button">Choose emoji…</button>
      </div>
      <div class="emoji-picker-wrap" id="emojiPickerWrap" hidden>
        <emoji-picker id="emojiPickerEl"></emoji-picker>
      </div>
    </div>

    <div id="uploadGroup" hidden>
      <input type="file" id="imageUploadInput" accept="image/*">
      <div class="upload-preview-wrap">
        <img id="uploadPreviewImg" class="upload-preview" hidden>
      </div>
    </div>

    <p class="modal-error" id="tileEditError" hidden></p>

    <div class="modal-actions">
      <button class="btn-secondary" id="tileEditCancelBtn">Cancel</button>
      <button class="btn-primary" id="tileEditSaveBtn">Save tile</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
